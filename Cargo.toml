[package]
name = "vanplan"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
console_error_panic_hook = "0.1.7"
flate2 = "1"
base64 = "0.22"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "DomRect",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Event",
    "EventTarget",
    "MouseEvent",
    "PointerEvent",
    "KeyboardEvent",
    "InputEvent",
    "console",
    "Location",
    "History",
    "HashChangeEvent",
    "CustomEvent",
    "CustomEventInit",
    "Response",
] }
